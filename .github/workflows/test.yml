name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check every file parses
        run: for f in $(git ls-files '*.js' ':!:public/vendor/*'); do node --check "$f" || exit 1; done
      - name: Run tests
        run: npm test
      - name: Build Docker image
        if: matrix.node == '22'
        run: docker build -t kess-cloud .

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Caddyfile
        run: >
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          -e KESS_DOMAIN=cloud.example.com -e ACME_EMAIL=ops@example.com
          caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validate docker compose file
        run: touch .env && docker compose -f deploy/docker-compose.yml config --quiet
      - name: Lint shell scripts
        run: shellcheck deploy/*.sh
